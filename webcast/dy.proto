// 团播"当前上播主播名单"帧（method: WebcastGroupLiveOnCamRecognitionMessage）。
// 直播中逐帧反复下发，entries 即此刻排在画面格子里的主播——**含没收过礼物、礼物口径看不见的那些**，
// 所以它是团播主播名单的权威来源（个播也可能给，退化成单条）。
// ⚠ 字段号来自真实报文的 protowire dump 核对（取法见 docs/dy-webcast-proto-check.md），
//    该消息不在我们已逐格核对的官方清单里，故只声明实测存在且计票要用的格：common(1)、data(2)、
//    data.entries(2)、entry.userId(1)。entry 的 3(fixed64)/4(bytes 格子几何) 与计票无关，未声明（未知字段自动忽略）。
//    entry.userId 是主播数字 uid 的字符串形式，与 GiftMessage.toUser.id 同一 id 空间，可靠 ParseUint 对齐。
message GroupLiveOnCamRecognitionMessage {
  Common common = 1; // 官方 common：Common；含 room_id（本场所属长房号）
  GroupLiveOnCamData data = 2; // 主播名单载体

  message GroupLiveOnCamData {
    repeated OnCamEntry entries = 2; // 每个上播主播一条
  }
  message OnCamEntry {
    string userId = 1; // 主播数字 uid（字符串）；本名单主键
  }
}