syntax = "proto3";

package douyin;

option go_package = "github.com/athlon18/douyin-protocol/webcast;pb";

// 官方定义：webcast.im.Response（共 13 格；本文件声明的字段号已逐格核对）
message Response {
  repeated Message messagesList = 1; // 官方该格是 messages：message（我们叫 messagesList）
  string cursor = 2; // 官方 cursor：string
  uint64 fetchInterval = 3; // 官方 fetch_interval：int64
  uint64 now = 4; // 官方 now：int64
  string internalExt = 5; // 官方 internal_ext：string
  uint32 fetchType = 6; // 官方 fetch_type：int32
  map<string, string> routeParams = 7;
  uint64 heartbeatDuration = 8; // 官方 heartbeat_duration：int64
  bool needAck = 9; // 官方 need_ack：bool
  string pushServer = 10; // 官方 push_server：string
  string liveCursor = 11; // 官方 live_cursor：string
  bool historyNoMore = 12; // 官方 history_no_more：bool
}

// 官方定义：webcast.im.Message（共 9 格；本文件声明的字段号已逐格核对）
message Message{
    string method = 1; // 官方 method：string
    bytes payload = 2; // 官方 payload：bytes
    int64 msgId = 3; // 官方 msg_id：int64
    int32 msgType = 4; // 官方 msg_type：int32
    int64 offset = 5; // 官方 offset：int64
    bool needWrdsStore = 6; // 官方 need_wrds_store：bool
    int64 wrdsVersion = 7; // 官方 wrds_version：int64
    string wrdsSubKey = 8; // 官方 wrds_sub_key：string
}

// 聊天
// 官方定义：webcast.im.ChatMessage（共 21 格；本文件声明的字段号已逐格核对）
message ChatMessage {
  Common common = 1; // 官方 common：Common；消息公共头（method/msg_id/room_id/create_time 等）
  User user = 2; // 官方 user：User；本条消息的主体用户
  string content = 3; // 官方 content：string；弹幕正文（实测正常解出，界面在用）
  bool visibleToSender = 4; // 官方 visible_to_sender：bool
  Image backgroundImage = 5; // 官方 background_image：Image
  string fullScreenTextColor = 6; // 官方 full_screen_text_color：string
  Image backgroundImageV2 = 7; // 官方 background_image_v2：Image
  PublicAreaCommon publicAreaCommon = 8; // 官方 public_area_common：PublicAreaCommon
  Image giftImage = 9; // 官方该格是 public_area_common：PublicAreaCommon（我们叫 giftImage）
  uint64 agreeMsgId = 11; // 官方 agree_msg_id：int64
  uint32 priorityLevel = 12; // 官方 priority_level：int32
  LandscapeAreaCommon landscapeAreaCommon = 13; // 官方 landscape_area_common：LandscapeAreaCommon
  uint64 eventTime = 15; // 官方 event_time：int64
  bool sendReview = 16; // 官方 send_review：bool
  bool fromIntercom = 17; // 官方 from_intercom：bool
  bool intercomHideUserCard = 18; // 官方 intercom_hide_user_card：bool
//  repeated chatTagsList = 19;
  string chatBy = 20; // 官方 chat_by：int64
  uint32 individualChatPriority = 21; // 官方 individual_chat_priority：int32
  Text rtfContent = 22; // 官方 rtf_content：Text
}


// 官方定义：webcast.im.LandscapeAreaCommon（共 5 格；本文件声明的字段号已逐格核对）
message LandscapeAreaCommon {
  bool showHead = 1; // 官方 show_head：bool
  bool showNickname = 2; // 官方 show_nickname：bool
  bool showFontColor = 3; // 官方 show_font_color：bool
  repeated string colorValueList = 4; // 官方该格是 color_value：string（我们叫 colorValueList）
  repeated CommentTypeTag commentTypeTagsList = 5; // 官方该格是 comment_type_tags：int32（我们叫 commentTypeTagsList），⚠ 官方为单值
}

// 官方定义：webcast.im.RoomUserSeqMessage（共 13 格；本文件声明的字段号已逐格核对）
message RoomUserSeqMessage {
  Common common = 1; // 官方 common：Common；消息公共头（method/msg_id/room_id/create_time 等）
  repeated RoomUserSeqMessageContributor ranksList = 2; // 官方该格是 ranks：RoomUserSeqMessage.Contributor（我们叫 ranksList）；房内贡献榜（实测只给前 3 名）
  int64 total = 3; // 官方 total：int64；当前在线人数（抖音口径，界面"在线人数"唯一出处）
  string popStr = 4; // 官方 pop_str：string；抖音自用文案，我们未使用（实测常为空）
  repeated RoomUserSeqMessageContributor seatsList = 5; // 官方该格是 seats：RoomUserSeqMessage.Contributor（我们叫 seatsList）；团播麦位表（下标即麦位序号）
  int64 popularity = 6; // 官方 popularity：int64
  int64 totalUser = 7; // 官方 total_user：int64；累计到访人数（进房人数口径）
  string totalUserStr = 8; // 官方 total_user_str：string
  string totalStr = 9; // 官方 total_str：string
  string onlineUserForAnchor = 10; // 官方 online_user_for_anchor：string
  string totalPvForAnchor = 11; // 官方 total_pv_for_anchor：string
  string upRightStatsStr = 12; // 官方 up_right_stats_str：string
  string upRightStatsStrComplete = 13; // 官方 up_right_stats_str_complete：string

}

// 官方定义：webcast.im.CommonTextMessage（共 4 格；本文件声明的字段号已逐格核对）
message CommonTextMessage {
  Common common = 1; // 官方 common：Common；消息公共头（method/msg_id/room_id/create_time 等）
  User user = 2; // 官方 user：User；本条消息的主体用户
  string scene = 3; // 官方 scene：string
}

// 官方定义：webcast.im.UpdateFanTicketMessage（共 4 格；本文件声明的字段号已逐格核对）
message UpdateFanTicketMessage {
  Common common = 1; // 官方 common：Common；消息公共头（method/msg_id/room_id/create_time 等）
  string roomFanTicketCountText = 2; // 官方 room_fan_ticket_count_text：string
  uint64 roomFanTicketCount = 3; // 官方 room_fan_ticket_count：int64；本场粉丝团票数（真正的粉丝票字段）
  bool forceUpdate = 4; // 官方 force_update：bool
}

// 官方定义：webcast.im.RoomUserSeqMessage.Contributor（共 7 格；本文件声明的字段号已逐格核对）
message RoomUserSeqMessageContributor {
  uint64 score = 1; // 官方 score：int64；该用户贡献分值
  User user = 2; // 官方 user：User；本条消息的主体用户
  uint64 rank = 3; // 官方 rank：int64；该用户榜内名次
  uint64 delta = 4; // 官方 delta：int64；本条消息带来的分值增量
  bool isHidden = 5; // 官方 is_hidden：bool；该条是否在抖音端隐藏
  string scoreDescription = 6; // 官方 score_description：string
  string exactlyScore = 7; // 官方 exactly_score：string
}

// 礼物消息
//
// 字段号/名称/类型已逐格对过抖音网页端自己下发的 protobuf 定义（见
// docs/dy-webcast-proto-check.md）。第 3 格以前被写成 `uint64 fanTicketCount`，
// 而官方那一格是 `repeated string to_openids` —— 类型不匹配，它永远只会解出 0；
// 全仓无人调用，故直接改成官方口径。真正的粉丝票数是下面第 13 格。
// 官方定义：webcast.im.GiftMessage（共 42 格；本文件声明的字段号已逐格核对）
message GiftMessage {
  Common common = 1; // 官方 common：Common；消息公共头（method/msg_id/room_id/create_time 等）
  uint64 giftId = 2; // 官方 gift_id：int64
  repeated string toOpenids = 3; // 官方 to_openids：string；官方 to_openids（以前误声明为 fanTicketCount）
  uint64 groupCount = 4; // 官方 group_count：int64；本组展示条数（连击每帧递增，用于去重后计数）
  uint64 repeatCount = 5; // 官方 repeat_count：int64；重复次数
  uint64 comboCount = 6; // 官方 combo_count：int64；连击数（group_count 为 0 时的兜底）
  User user = 7; // 官方 user：User；本条消息的主体用户
  User toUser = 8; // 官方 to_user：User
  uint32 repeatEnd = 9; // 官方 repeat_end：int32；连击结束标记
  TextEffect textEffect = 10; // 官方 text_effect：GiftMessage.TextEffect；弹幕文字特效
  uint64 groupId = 11; // 官方 group_id：int64；连击组 ID：同一次连击不变，按它增量去重
  uint64 incomeTaskgifts = 12; // 官方 income_taskgifts：int64
  uint64 roomFanTicketCount = 13; // 官方 room_fan_ticket_count：int64；本场粉丝团票数（真正的粉丝票字段）
  GiftIMPriority priority = 14; // 官方 priority：GiftIMPriority
  GiftStruct gift = 15; // 官方 gift：GiftStruct；礼物结构体（名称/单价/图标/特效 ID）
  string logId = 16; // 官方 log_id：string；抖音侧日志 ID（排查单笔礼物用）
  uint64 sendType = 17; // 官方 send_type：int64；送出方式（1 普通 2 包场 3 任务礼物 4 特殊 5 全服 6 手气卡）
  PublicAreaCommon publicAreaCommon = 18; // 官方 public_area_common：PublicAreaCommon
  Text trayDisplayText = 19; // 官方 tray_display_text：Text
  uint64 bannedDisplayEffects = 20; // 官方 banned_display_effects：int64
//  GiftTrayInfo trayInfo = 21;
//  AssetEffectMixInfo assetEffectMixInfo = 22;
  bool displayForSelf = 25; // 官方 display_for_self：bool
  string interactGiftInfo = 26; // 官方 interact_gift_info：string
  string diyItemInfo = 27; // 官方 diy_item_info：string
  repeated uint64 minAssetSetList = 28; // 官方该格是 min_asset_set：int64（我们叫 minAssetSetList），⚠ 官方为单值
  uint64 totalCount = 29; // 官方 total_count：int64
  uint32 clientGiftSource = 30; // 官方 client_gift_source：int32
//  AnchorGiftData anchorGift = 31;
  repeated uint64 toUserIdsList = 32; // 官方该格是 to_user_ids：int64（我们叫 toUserIdsList），⚠ 官方为单值
  uint64 sendTime = 33; // 官方 send_time：int64
  uint64 forceDisplayEffects = 34; // 官方 force_display_effects：int64
  string traceId = 35; // 官方 trace_id：string
  uint64 effectDisplayTs = 36; // 官方 effect_display_ts：int64
}

// 官方定义：webcast.data.GiftStruct（共 81 格；本文件声明的字段号已逐格核对）
message GiftStruct {
  Image image = 1; // 官方 image：Image；礼物图标
  string describe = 2; // 官方 describe：string
  bool notify = 3; // 官方 notify：bool
  uint64 duration = 4; // 官方 duration：int64
  uint64 id = 5; // 官方 id：int64；用户数字 ID（名册主键）
//  GiftStructFansClubInfo fansclubInfo = 6;
  bool forLinkmic = 7; // 官方 for_linkmic：bool
  bool doodle = 8; // 官方 doodle：bool
  bool forFansclub = 9; // 官方 for_fansclub：bool
  bool combo = 10; // 官方 combo：bool
  uint32 type = 11; // 官方 type：int32
  uint32 diamondCount = 12; // 官方 diamond_count：int32；礼物单价（抖币；与音浪 1:1）
  bool isDisplayedOnPanel = 13; // 官方 is_displayed_on_panel：bool
  uint64 primaryEffectId = 14; // 官方 primary_effect_id：int64；主特效 ID（全屏特效关联用）
  Image giftLabelIcon = 15; // 官方 gift_label_icon：Image
  string name = 16; // 官方 name：string；名称
  string region = 17; // 官方 region：string
  string manual = 18; // 官方 manual：string
  bool forCustom = 19; // 官方 for_custom：bool
  //  specialEffectsMap = 20;
  Image icon = 21; // 官方 icon：Image；事件图标
  uint32 actionType = 22; // 官方 action_type：int32
  // fixme 后面的就不写了还有几十个属性

}

// 官方定义：webcast.data.GiftIMPriority（共 3 格；本文件声明的字段号已逐格核对）
message GiftIMPriority {
    repeated uint64 queueSizesList = 1; // 官方该格是 queue_sizes：int64（我们叫 queueSizesList），⚠ 官方为单值
    uint64 selfQueuePriority = 2; // 官方 self_queue_priority：int64
    uint64 priority = 3; // 官方 priority：int64
}

// ⚠ 官方 schema（webcast.im / webcast.data）里找不到同名消息，字段号未经对照
message TextEffect {
  TextEffectDetail portrait = 1; // ⚠ 官方该消息没有第 1 格（自留/待核字段）
  TextEffectDetail landscape = 2; // ⚠ 官方该消息没有第 2 格（自留/待核字段）
}

// ⚠ 官方 schema（webcast.im / webcast.data）里找不到同名消息，字段号未经对照
message TextEffectDetail {
  Text text = 1; // ⚠ 官方该消息没有第 1 格（自留/待核字段）
  uint32 textFontSize = 2; // ⚠ 官方该消息没有第 2 格（自留/待核字段）
  Image background = 3; // ⚠ 官方该消息没有第 3 格（自留/待核字段）
  uint32 start = 4; // ⚠ 官方该消息没有第 4 格（自留/待核字段）
  uint32 duration = 5; // ⚠ 官方该消息没有第 5 格（自留/待核字段）
  uint32 x = 6; // ⚠ 官方该消息没有第 6 格（自留/待核字段）
  uint32 y = 7; // ⚠ 官方该消息没有第 7 格（自留/待核字段）
  uint32 width = 8; // ⚠ 官方该消息没有第 8 格（自留/待核字段）
  uint32 height = 9; // ⚠ 官方该消息没有第 9 格（自留/待核字段）
  uint32 shadowDx = 10; // ⚠ 官方该消息没有第 10 格（自留/待核字段）
  uint32 shadowDy = 11; // ⚠ 官方该消息没有第 11 格（自留/待核字段）
  uint32 shadowRadius = 12; // ⚠ 官方该消息没有第 12 格（自留/待核字段）
  string shadowColor = 13; // ⚠ 官方该消息没有第 13 格（自留/待核字段）
  string strokeColor = 14; // ⚠ 官方该消息没有第 14 格（自留/待核字段）
  uint32 strokeWidth = 15; // ⚠ 官方该消息没有第 15 格（自留/待核字段）
}

// 成员消息
// 官方定义：webcast.im.MemberMessage（共 24 格；本文件声明的字段号已逐格核对）
message MemberMessage {
  Common common = 1; // 官方 common：Common；消息公共头（method/msg_id/room_id/create_time 等）
  User user = 2; // 官方 user：User；本条消息的主体用户
  // 官方这一格是 user_open_id（字符串）；以前写成 uint64 memberCount 且永远解出 0。
  // 官方 MemberMessage 24 格里根本没有 member_count，“进场人数”只能取
  // RoomUserSeqMessage.total_user，不要从这里拿。
  string userOpenId = 3; // 官方 user_open_id：string
  User operator = 4; // 官方 operator：User
  bool isSetToAdmin = 5; // 官方 is_set_to_admin：bool
  bool isTopUser = 6; // 官方 is_top_user：bool
  uint64 rankScore = 7; // 官方 rank_score：int64
  uint64 topUserNo = 8; // 官方 top_user_no：int64
  uint64 enterType = 9; // 官方 enter_type：int64；进场方式
  uint64 action = 10; // 官方 action：int64；动作码（进场/关注/分享等事件的类型）
  string actionDescription = 11; // 官方 action_description：string
  uint64 userId = 12; // 官方 user_id：int64
  EffectConfig effectConfig = 13; // 官方 effect_config：MemberMessage.EffectConfig
  string popStr = 14; // 官方 pop_str：string；抖音自用文案，我们未使用（实测常为空）
  EffectConfig enterEffectConfig = 15; // 官方 enter_effect_config：MemberMessage.EffectConfig
  Image backgroundImage = 16; // 官方 background_image：Image
  Image backgroundImageV2 = 17; // 官方 background_image_v2：Image
  Text anchorDisplayText = 18; // 官方 anchor_display_text：Text
  PublicAreaCommon publicAreaCommon = 19; // 官方 public_area_common：PublicAreaCommon
  uint64 userEnterTipType = 20; // 官方 user_enter_tip_type：int64
  uint64 anchorEnterTipType = 21; // 官方 anchor_enter_tip_type：int64
}


// 官方定义：webcast.im.PublicAreaCommon（共 26 格；本文件声明的字段号已逐格核对）
message PublicAreaCommon {
  Image userLabel = 1; // 官方 user_label：Image
  uint64 userConsumeInRoom = 2; // 官方 user_consume_in_room：int64
  uint64 userSendGiftCntInRoom = 3; // 官方 user_send_gift_cnt_in_room：int64
}

// ⚠ 官方 schema（webcast.im / webcast.data）里找不到同名消息，字段号未经对照
message EffectConfig {
  uint64 type = 1; // ⚠ 官方该消息没有第 1 格（自留/待核字段）
  Image icon = 2; // ⚠ 官方该消息没有第 2 格（自留/待核字段）
  uint64 avatarPos = 3; // ⚠ 官方该消息没有第 3 格（自留/待核字段）
  Text text = 4; // ⚠ 官方该消息没有第 4 格（自留/待核字段）
  Image textIcon = 5; // ⚠ 官方该消息没有第 5 格（自留/待核字段）
  uint32 stayTime = 6; // ⚠ 官方该消息没有第 6 格（自留/待核字段）
  uint64 animAssetId = 7; // ⚠ 官方该消息没有第 7 格（自留/待核字段）
  Image badge = 8; // ⚠ 官方该消息没有第 8 格（自留/待核字段）
  repeated uint64 flexSettingArrayList = 9; // ⚠ 官方该消息没有第 9 格（自留/待核字段）
  Image textIconOverlay = 10; // ⚠ 官方该消息没有第 10 格（自留/待核字段）
  Image animatedBadge = 11; // ⚠ 官方该消息没有第 11 格（自留/待核字段）
  bool hasSweepLight = 12; // ⚠ 官方该消息没有第 12 格（自留/待核字段）
  repeated uint64 textFlexSettingArrayList = 13; // ⚠ 官方该消息没有第 13 格（自留/待核字段）
  uint64 centerAnimAssetId = 14; // ⚠ 官方该消息没有第 14 格（自留/待核字段）
  Image dynamicImage = 15; // ⚠ 官方该消息没有第 15 格（自留/待核字段）
  map<string,string> extraMap = 16;
  uint64 mp4AnimAssetId = 17; // ⚠ 官方该消息没有第 17 格（自留/待核字段）
  uint64 priority = 18; // ⚠ 官方该消息没有第 18 格（自留/待核字段）
  uint64 maxWaitTime = 19; // ⚠ 官方该消息没有第 19 格（自留/待核字段）
  string dressId = 20; // ⚠ 官方该消息没有第 20 格（自留/待核字段）
  uint64 alignment = 21; // ⚠ 官方该消息没有第 21 格（自留/待核字段）
  uint64 alignmentOffset = 22; // ⚠ 官方该消息没有第 22 格（自留/待核字段）
}

// 官方定义：webcast.data.Text（共 4 格；本文件声明的字段号已逐格核对）
message Text {
  string key = 1; // 官方 key：string
  string defaultPatter = 2; // 官方该格是 default_pattern：string（我们叫 defaultPatter）
  TextFormat defaultFormat = 3; // 官方 default_format：TextFormat
  repeated TextPiece piecesList = 4; // 官方该格是 pieces：TextPiece（我们叫 piecesList）
}

// 官方定义：webcast.data.TextPiece（共 11 格；本文件声明的字段号已逐格核对）
message TextPiece {
  bool type = 1; // 官方 type：int32
  TextFormat format = 2; // 官方 format：TextFormat
  string stringValue = 3; // 官方该格是 value_ref：string（我们叫 stringValue）
  TextPieceUser userValue = 4; // 官方 user_value：TextPieceUser
  TextPieceGift giftValue = 5; // 官方 gift_value：TextPieceGift
  TextPieceHeart heartValue = 6; // 官方 heart_value：TextPieceHeart
  TextPiecePatternRef patternRefValue = 7; // 官方 pattern_ref_value：TextPiecePatternRef
  TextPieceImage imageValue = 8; // 官方 image_value：TextPieceImage
}


// 官方定义：webcast.data.TextPieceImage（共 2 格；本文件声明的字段号已逐格核对）
message TextPieceImage {
  Image image = 1; // 官方 image：Image；礼物图标
  float scalingRate = 2; // 官方 scaling_rate：float
}

// 官方定义：webcast.data.TextPiecePatternRef（共 2 格；本文件声明的字段号已逐格核对）
message TextPiecePatternRef {
  string key = 1; // 官方 key：string
  string defaultPattern = 2; // 官方 default_pattern：string
}

// 官方定义：webcast.data.TextPieceHeart（共 1 格；本文件声明的字段号已逐格核对）
message TextPieceHeart {
  string color = 1; // 官方 color：string
}

// 官方定义：webcast.data.TextPieceGift（共 2 格；本文件声明的字段号已逐格核对）
message TextPieceGift {
  uint64 giftId = 1; // 官方 gift_id：int64
  PatternRef nameRef = 2; // 官方 name_ref：PatternRef
}

// 官方定义：webcast.data.PatternRef（共 2 格；本文件声明的字段号已逐格核对）
message PatternRef {
  string key = 1; // 官方 key：string
  string defaultPattern = 2; // 官方 default_pattern：string
}

// 官方定义：webcast.data.TextPieceUser（共 6 格；本文件声明的字段号已逐格核对）
message TextPieceUser {
  User user = 1; // 官方 user：User；本条消息的主体用户
  bool withColon = 2; // 官方 with_colon：bool
}

// 官方定义：webcast.data.TextFormat（共 12 格；本文件声明的字段号已逐格核对）
message TextFormat {
  string color = 1; // 官方 color：string
  bool bold = 2; // 官方 bold：bool
  bool italic = 3; // 官方 italic：bool
  uint32 weight = 4; // 官方 weight：int32
